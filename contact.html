<body>

<!-- ============ NAV ============ -->
<header class="nav">
  <div class="nav__inner">
    <a class="brand" href="index.html" aria-label="IKstudios home">
      <img class="brand__logo" src="assets/img/logo-mark.png" alt="IKstudios">
    </a>
    <nav class="nav__links" aria-label="Primary">
      <a href="about.html" data-page="about.html">About</a>
      <a href="contact.html" data-page="contact.html">Contact</a>
      <a class="ext" href="https://www.flickr.com/photos/vtkrrishblazephotography/albums" target="_blank" rel="noopener">
        Portfolio
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </a>
    </nav>
  </div>
</header>

<main class="page">

  <!-- ============ HEADER ============ -->
  <section class="pagehead">
    <div class="pagehead__leak" aria-hidden="true"></div>
    <div class="wrap">
      <span class="eyebrow">Get in touch</span>
      <h1>Contact me</h1>
      <p class="pagehead__lede">Shoot me a message for any questions, inquiries, quotes, or bookings.</p>
    </div>
  </section>

  <div class="reelband" aria-hidden="true"><div class="reel reel--band" data-reel></div></div>

  <!-- ============ FORM ============ -->
  <section class="section">
    <div class="wrap">
      <div class="contact">
        <form id="contactForm" novalidate>
          <div class="field">
            <label for="name">Name <span class="req">*</span></label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
          </div>
          <div class="field">
            <label for="email">Email address <span class="req">*</span></label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@email.com" required>
          </div>
          <div class="field">
            <label for="message">Message <span class="req">*</span></label>
            <textarea id="message" name="message" placeholder="Tell me about your project, event, or idea…" required></textarea>
          </div>
          <div class="form__row">
            <button class="btn btn--primary" type="submit">
              Send message
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
            <span id="formStatus" class="form__status" role="status" aria-live="polite"></span>
          </div>
        </form>

        <!-- success panel -->
        <div id="thanks" class="thanks" role="status" aria-live="polite">
          <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg></div>
          <h2>Thank you!</h2>
          <p>Your message is on its way. I'll get back to you as soon as I can.</p>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- ============ FOOTER ============ -->

  <div class="wrap footer__inner">
    <div>
      <img class="footer__logo" src="assets/img/logo.png" alt="IKstudios">
    </div>

      <a href="https://www.instagram.com/_ikstudios_/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg></a>
      <a href="https://www.youtube.com/@ikstudios23" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.2-.4-4.7a2.5 2.5 0 0 0-1.76-1.77C19.28 5 12 5 12 5s-7.28 0-8.84.53A2.5 2.5 0 0 0 1.4 7.3C1 8.8 1 12 1 12s0 3.2.4 4.7a2.5 2.5 0 0 0 1.76 1.77C4.72 19 12 19 12 19s7.28 0 8.84-.53a2.5 2.5 0 0 0 1.76-1.77C23 15.2 23 12 23 12Zm-13 3V9l5.2 3L10 15Z"/></svg></a>
      <a href="https://www.flickr.com/people/vtkrrishblazephotography/" target="_blank" rel="noopener" aria-label="Flickr"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="12" r="4"/><circle cx="17" cy="12" r="4"/></svg></a>
